version: "3.8"

services:
  db:
    image: mysql:8
    container_name: quiz_db
    environment:
      MYSQL_ROOT_PASSWORD: Dinesh@1245
      MYSQL_DATABASE: quiz_app
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: quiz_backend
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: Dinesh@1245
      DB_NAME: quiz_app
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: quiz_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db_data:
